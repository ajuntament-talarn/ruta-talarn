<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Els Secrets de Pedra de Talarn</title>
<meta name="description" content="Ruta geològica urbana de Talarn. Onze parades, onze pedres, una frase secreta.">
<meta name="theme-color" content="#E3E3DC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&family=Karla:wght@400..700&display=swap" rel="stylesheet">

<!-- ==========================================================================
     ELS SECRETS DE PEDRA DE TALARN
     Ruta geològica urbana — Ajuntament de Talarn / Geoparc Orígens

     ELS TEXTOS NO SÓN EN AQUEST FITXER.
     Són tots a textos.js, en quatre llengües. Aquí només hi ha el
     disseny i el funcionament del joc.

     ENLLAÇOS PER ALS QR
     Parada 1   →  .../index.html?p=1
     Parada 5   →  .../index.html?p=5
     Portada    →  .../index.html
     En francès →  .../index.html?p=5&l=fr   (opcional; el visitant
                   també pot canviar de llengua des de la pàgina)
     ========================================================================== -->

<style>
:root{
  --stone:#E3E3DC;          /* fons: calcària amb liquen */
  --stone-2:#D6D6CD;
  --ink:#22282A;
  --ink-soft:#5C6260;
  --marker:#F2B705;         /* groc del retolador de les fotos */
  --rust:#8C4432;           /* grès vermell */
  --paper:#EEEEE7;
  --err:#8C4432;
  --radius:14px;
  --w:640px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--stone);color:var(--ink);
  font-family:'Karla',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--w);margin:0 auto;padding:0 20px 64px}

/* ---------- capçalera ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--stone);
  border-bottom:1px solid var(--stone-2);padding-top:env(safe-area-inset-top);
}
.topbar-inner{max-width:var(--w);margin:0 auto;padding:10px 20px 0}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand a.title{
  font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);text-decoration:none;line-height:1.4;
}
.brand a.title:hover{color:var(--ink)}
.langs{display:flex;gap:2px;flex-shrink:0}
.langs button{
  font:inherit;font-size:11px;font-weight:700;letter-spacing:.08em;
  background:none;border:0;padding:5px 6px;border-radius:6px;
  color:var(--ink-soft);cursor:pointer;text-transform:uppercase;
}
.langs button[aria-current="true"]{background:var(--marker);color:var(--ink)}
.langs button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
/* columna estratigràfica: una capa per parada */
.strata{display:flex;gap:2px;padding:8px 0 9px}
.strata span{
  flex:1;height:7px;border-radius:2px;background:var(--stone-2);
  transition:transform .2s ease;
}
.strata span.done{opacity:.85}
.strata span.here{transform:scaleY(2.4)}

/* ---------- parada ---------- */
.eyebrow{display:flex;align-items:baseline;gap:10px;margin:30px 0 2px}
.eyebrow .num{
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 144,'WONK' 1;
  font-weight:900;font-size:52px;line-height:.85;color:var(--rust);
}
.eyebrow .of{
  font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);
}
h1{
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 96,'WONK' 1;
  font-weight:600;font-size:30px;line-height:1.15;
  margin:6px 0 20px;letter-spacing:-.01em;
}
figure{margin:0 0 8px}
figure img{width:100%;display:block;border-radius:var(--radius);background:var(--stone-2)}
figcaption{font-size:12.5px;color:var(--ink-soft);margin-top:8px;letter-spacing:.02em}
.intro{font-size:17.5px;margin:22px 0 0}
hr.rule{border:0;height:1px;background:var(--stone-2);margin:30px 0 26px}
.q{
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 40,'WONK' 1;
  font-weight:600;font-size:21px;line-height:1.3;margin:0 0 18px;
}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  font:inherit;text-align:left;width:100%;
  background:var(--paper);color:var(--ink);
  border:1.5px solid var(--stone-2);border-radius:var(--radius);
  padding:14px 16px;cursor:pointer;
  transition:border-color .15s ease,background .15s ease,transform .1s ease;
}
.opt:hover{border-color:var(--ink-soft)}
.opt:active{transform:scale(.99)}
.opt:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.opt[disabled]{cursor:default;opacity:.45}
.opt.wrong{border-color:var(--err);color:var(--err);opacity:1;animation:shake .35s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}40%{transform:translateX(5px)}
  60%{transform:translateX(-3px)}80%{transform:translateX(2px)}
}
.retry{margin-top:14px;font-size:15px;color:var(--err);display:none}
.retry.show{display:block}

/* ---------- revelació ---------- */
.reveal{margin-top:8px}
.badge{position:relative;display:block;text-align:center;padding:34px 20px 38px}
.badge .label{
  font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);display:block;margin-bottom:6px;
}
.badge .word{
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 144,'WONK' 1;
  font-weight:900;font-size:clamp(28px,8.5vw,46px);
  letter-spacing:.02em;text-transform:uppercase;position:relative;z-index:2;
}
.badge svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.badge svg path{
  fill:none;stroke:var(--marker);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:1200;stroke-dashoffset:1200;
  animation:draw .85s cubic-bezier(.4,0,.2,1) .15s forwards;
}
@keyframes draw{to{stroke-dashoffset:0}}
.expl p{margin:0 0 14px}
.expl p:last-child{margin-bottom:0}

/* ---------- registre ---------- */
.reg{background:var(--paper);border:1.5px solid var(--stone-2);border-radius:var(--radius);padding:20px;margin:26px 0}
.reg h2{
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 40,'WONK' 1;
  font-weight:600;font-size:19px;margin:0 0 4px;
}
.reg p{font-size:14.5px;color:var(--ink-soft);margin:0 0 16px}
.field{margin-bottom:13px}
.field label{
  display:block;font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;
}
.field input{
  font:inherit;width:100%;padding:12px 14px;background:var(--stone);color:var(--ink);
  border:1.5px solid var(--stone-2);border-radius:10px;
}
.field input:focus{outline:3px solid var(--marker);outline-offset:1px;border-color:var(--ink-soft)}
.btn{
  font:inherit;font-weight:700;width:100%;padding:14px 18px;border:0;
  border-radius:var(--radius);background:var(--marker);color:var(--ink);cursor:pointer;
}
.btn:active{transform:scale(.99)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.reg .skip{
  display:block;width:100%;text-align:center;margin-top:12px;background:none;border:0;
  font:inherit;font-size:13.5px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;
}
.team{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:26px 0 0}

/* ---------- navegació ---------- */
.next{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-top:32px;padding:18px 20px;background:var(--ink);color:var(--paper);
  border-radius:var(--radius);text-decoration:none;font-weight:700;
}
.next span:last-child{font-size:22px;line-height:1}
.next:focus-visible{outline:3px solid var(--marker);outline-offset:3px}
.backlink{display:inline-block;margin-top:22px;font-size:14px;color:var(--ink-soft)}

/* ---------- portada ---------- */
.cover-img{width:100%;display:block;border-radius:var(--radius);margin-top:22px}
.cover h1{
  font-size:clamp(32px,9vw,46px);font-weight:900;
  font-variation-settings:'opsz' 144,'WONK' 1;
  margin:26px 0 14px;line-height:1.02;letter-spacing:-.02em;
}
.cover .lede{font-size:19px;margin:0 0 26px}
.steps{list-style:none;padding:0;margin:0 0 30px;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 14px 40px}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;
  border-radius:50%;background:var(--marker);color:var(--ink);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
}

/* ---------- paraules recollides ---------- */
.collected{margin-top:38px;padding-top:24px;border-top:1px solid var(--stone-2)}
.collected h2{
  font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 12px;
}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-size:13px;font-weight:700;letter-spacing:.04em;padding:5px 11px;border-radius:999px;
  background:var(--paper);border:1.5px solid var(--stone-2);color:var(--ink-soft);
}
.chip.got{background:var(--marker);border-color:var(--marker);color:var(--ink)}
.reset{
  margin-top:16px;background:none;border:0;padding:0;font:inherit;font-size:13px;
  color:var(--ink-soft);text-decoration:underline;cursor:pointer;
}

/* ---------- final ---------- */
.phrase{
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 144,'WONK' 1;
  font-weight:900;font-size:clamp(25px,7vw,38px);line-height:1.12;
  text-transform:uppercase;margin:24px 0;letter-spacing:-.01em;
}

/* ---------- botó panells ---------- */
.panells-toggle{
  display:flex;justify-content:center;padding:6px 0 9px;
}
.panells-toggle button{
  font:inherit;font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;background:none;border:1.5px solid var(--stone-2);
  border-radius:999px;padding:5px 14px;color:var(--ink-soft);cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.panells-toggle button:hover{ border-color:var(--ink-soft); color:var(--ink); }
.panells-toggle button.active{
  background:var(--ink);border-color:var(--ink);color:var(--paper);
}
.panells-toggle button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- vista panells - llista ---------- */
.panells-header{ margin:30px 0 20px; }
.panells-header h1{
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 96,'WONK' 1;
  font-weight:600;font-size:30px;line-height:1.15;
  margin:0 0 8px;letter-spacing:-.01em;
}
.panells-header p{ font-size:16px;color:var(--ink-soft);margin:0 0 16px; }
.panells-langs{ display:flex;gap:4px;margin-bottom:24px; }
.panells-langs button{
  font:inherit;font-size:11px;font-weight:700;letter-spacing:.08em;
  background:none;border:0;padding:5px 8px;border-radius:6px;
  color:var(--ink-soft);cursor:pointer;text-transform:uppercase;
}
.panells-langs button[aria-current="true"]{ background:var(--marker);color:var(--ink); }
.panells-langs button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

.panells-grid{ display:flex;flex-direction:column;gap:10px;margin-bottom:40px; }
.panell-card{
  display:flex;align-items:center;gap:14px;
  background:var(--paper);border:1.5px solid var(--stone-2);
  border-radius:var(--radius);padding:14px 16px;cursor:pointer;
  text-align:left;font:inherit;color:var(--ink);width:100%;
  transition:border-color .15s,transform .1s;
}
.panell-card:hover{ border-color:var(--ink-soft); }
.panell-card:active{ transform:scale(.99); }
.panell-card:focus-visible{ outline:3px solid var(--marker);outline-offset:2px; }
.panell-card .pnum{
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 60,'WONK' 1;
  font-weight:900;font-size:28px;line-height:1;
  flex-shrink:0;width:36px;text-align:right;color:var(--rust);
}
.panell-card .pinfo{ flex:1;min-width:0; }
.panell-card .plab{
  font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:2px;
}
.panell-card .pnom{
  font-size:16px;font-weight:700;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.panell-card .parrow{ font-size:18px;color:var(--ink-soft);flex-shrink:0; }

/* ---------- vista panell detall ---------- */
.panell-detall-header{ margin:28px 0 20px; }
.panell-detall-header .eyebrow{ margin-top:0; }
.panell-detall-langs{
  display:flex;gap:4px;margin:16px 0 24px;
}
.panell-detall-langs button{
  font:inherit;font-size:11px;font-weight:700;letter-spacing:.08em;
  background:none;border:0;padding:5px 8px;border-radius:6px;
  color:var(--ink-soft);cursor:pointer;text-transform:uppercase;
}
.panell-detall-langs button[aria-current="true"]{ background:var(--marker);color:var(--ink); }
.panell-detall-langs button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

.panell-seccio{ margin:0 0 28px; }
.panell-seccio:last-child{ margin-bottom:0; }
.panell-titol{
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 40,'WONK' 1;
  font-weight:600;font-size:20px;line-height:1.25;
  margin:0 0 12px;letter-spacing:-.01em;
}
.panell-seccio p{ margin:0 0 12px;font-size:16.5px; }
.panell-seccio p:last-child{ margin-bottom:0; }
.panell-seccio figure{ margin:0 0 16px; }
.panell-back{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:30px;font-size:14px;color:var(--ink-soft);
  background:none;border:0;padding:0;font:inherit;cursor:pointer;
  text-decoration:underline;
}
.panell-tornar-joc{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-top:24px;padding:16px 20px;
  background:var(--stone-2);color:var(--ink);
  border-radius:var(--radius);text-decoration:none;font-weight:700;font-size:15px;
  border:1.5px solid var(--stone-2);cursor:pointer;font:inherit;width:100%;text-align:left;
}
.panell-tornar-joc:focus-visible{outline:3px solid var(--marker);outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .badge svg path{stroke-dashoffset:0}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <a class="title" href="?" id="brand">Els Secrets de Pedra de Talarn</a>
      <div class="langs" id="langs"></div>
    </div>
    <div class="strata" id="strata" aria-hidden="true"></div>
    <div class="panells-toggle">
      <button type="button" id="panells-btn">Panells</button>
    </div>
  </div>
</header>

<div class="wrap" id="app">
  <noscript><p class="intro">Aquest joc necessita JavaScript activat al navegador.</p></noscript>
</div>

<script src="textos.js"></script>
<script src="panells.js"></script>
<script>
/* ==========================================================================
   REGISTRE D'EQUIPS
   Per obtenir els codis: formulari → tres punts → "Obtén l'enllaç
   preemplenat" → omple els camps → copia els entry.XXXXXXXXX de l'adreça.
   ========================================================================== */
const FORM_URL      = "https://docs.google.com/forms/d/e/1FAIpQLSfKY70N4WnAQ2hV0s5uBgRPs5Mm3oYwbhl2e8D_pOxtiRw_nA/formResponse";
const ENTRY_NOM     = "entry.2003585465";   // nom o nom d'equip
const ENTRY_MEMBRES = "entry.986730963";    // nombre de membres
const ENTRY_IDIOMA  = "";                   // opcional: camp per a la llengua

/* ==========================================================================
   Funcionament
   ========================================================================== */
const KEY = 'talarn-secrets-v1';

function llegeix(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function escriu(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esborra(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* ---------- llengua ---------- */
function detectaIdioma(){
  const q = new URLSearchParams(location.search).get('l');
  if(IDIOMES.includes(q)) return q;
  const desat = llegeix(KEY+'-lang');
  if(IDIOMES.includes(desat)) return desat;
  const nav = (navigator.language || 'ca').slice(0,2).toLowerCase();
  if(IDIOMES.includes(nav)) return nav;
  return 'ca';
}
let L = detectaIdioma();
const t = ()=>UI[L];

function canviaIdioma(nou){
  if(!IDIOMES.includes(nou) || nou === L) return;
  L = nou; escriu(KEY+'-lang', nou);
  document.documentElement.lang = nou;
  document.title = t().titol;
  const u = new URL(location);
  if(u.searchParams.has('l')) u.searchParams.set('l', nou);
  history.replaceState({}, '', u);
  pintaIdiomes(); ruta();
}

function pintaIdiomes(){
  langs.innerHTML = IDIOMES.map(l=>
    `<button type="button" data-l="${l}" aria-current="${l===L}" lang="${l}">${l}</button>`
  ).join('');
  langs.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>canviaIdioma(b.dataset.l);
  });
}

/* ---------- estat ---------- */
let estat = llegeix(KEY) || {};
const app    = document.getElementById('app');
const strata = document.getElementById('strata');
const langs  = document.getElementById('langs');
const brand  = document.getElementById('brand');

function esc(s){
  return String(s).replace(/[&<>"']/g, c=>(
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- equip ---------- */
function equip(){ return llegeix(KEY+'-equip'); }
function enviaEquip(nom, membres){
  if(!ENTRY_NOM || !ENTRY_MEMBRES) return;
  const d = new FormData();
  d.append(ENTRY_NOM, nom);
  d.append(ENTRY_MEMBRES, membres);
  if(ENTRY_IDIOMA) d.append(ENTRY_IDIOMA, L);
  fetch(FORM_URL, {method:'POST', mode:'no-cors', body:d}).catch(()=>{});
}
function blocRegistre(){
  if(equip()) return '';
  const u = t();
  return `<section class="reg" id="reg">
    <h2>${u.regTitol}</h2>
    <p>${u.regText}</p>
    <div class="field">
      <label for="rnom">${u.regNom}</label>
      <input id="rnom" type="text" autocomplete="off" maxlength="60" placeholder="${u.regNomPh}">
    </div>
    <div class="field">
      <label for="rmem">${u.regMem}</label>
      <input id="rmem" type="number" inputmode="numeric" min="1" max="60" placeholder="4">
    </div>
    <button class="btn" id="rok">${u.regOk}</button>
    <button class="skip" id="rskip">${u.regSkip}</button>
  </section>`;
}
function lligaRegistre(){
  const box = document.getElementById('reg');
  if(!box) return;
  const nom = document.getElementById('rnom');
  const mem = document.getElementById('rmem');
  const fi = anonim=>{
    const n = anonim ? '' : nom.value.trim();
    const m = anonim ? '' : mem.value.trim();
    if(!anonim && !n){ nom.focus(); return; }
    escriu(KEY+'-equip', {nom:n, membres:m});
    if(!anonim) enviaEquip(n, m);
    ruta();
  };
  document.getElementById('rok').onclick   = ()=>fi(false);
  document.getElementById('rskip').onclick = ()=>fi(true);
  nom.addEventListener('keydown', e=>{ if(e.key==='Enter') mem.focus(); });
  mem.addEventListener('keydown', e=>{ if(e.key==='Enter') fi(false); });
}
function retolEquip(){
  const e = equip();
  return (e && e.nom) ? `<p class="team">${t().equip} ${esc(e.nom)}</p>` : '';
}

/* ---------- peces comunes ---------- */
function pintaStrata(actual){
  strata.innerHTML = '';
  PARADES.forEach(p=>{
    const s = document.createElement('span');
    if(estat[p.num]){ s.classList.add('done'); s.style.background = p.color; }
    if(p.num === actual) s.classList.add('here');
    strata.appendChild(s);
  });
}
function chips(){
  const c = PARADES.map(p=>
    `<span class="chip${estat[p.num]?' got':''}">${estat[p.num] ? p.paraula[L] : '·····'}</span>`
  ).join('');
  return `<section class="collected">
    <h2>${t().paraules}</h2>
    <div class="chips">${c}</div>
    <button class="reset" id="reset">${t().reset}</button>
  </section>`;
}
function lligaReset(){
  const b = document.getElementById('reset');
  if(!b) return;
  b.onclick = ()=>{
    if(confirm(t().confirmReset)){
      estat = {}; escriu(KEY, estat); esborra(KEY+'-equip'); ruta();
    }
  };
}

/* cercle irregular, dibuixat com amb retolador */
const CIRCLE = `<svg viewBox="0 0 300 120" preserveAspectRatio="none" aria-hidden="true">
  <path vector-effect="non-scaling-stroke" d="M150 8 C 66 8, 10 30, 10 60 C 10 92, 74 112, 152 112 C 232 112, 292 92, 290 58 C 288 28, 226 8, 146 9 C 108 9, 74 15, 52 26"/>
</svg>`;

/* ---------- vista de parada ---------- */
function vistaParada(p){
  const u = t(), fet = !!estat[p.num], seg = PARADES.find(x=>x.num === p.num+1);
  app.innerHTML = `
  <div class="eyebrow">
    <span class="num" style="color:${p.color}">${p.num}</span>
    <span class="of">${u.deOnze(p.num)}</span>
  </div>
  <h1>${p.nom[L]}</h1>
  ${p.num === 1 ? blocRegistre() : ''}
  ${p.foto ? `<figure><img src="${p.foto}" alt="${p.peu[L]}" loading="lazy">
      <figcaption>${p.peu[L]}</figcaption></figure>` : ''}
  <p class="intro">${p.intro[L]}</p>
  <hr class="rule">
  <p class="q">${p.pregunta[L]}</p>
  <div class="opts" id="opts"></div>
  <p class="retry" id="retry">${u.retry}</p>
  <div class="reveal" id="reveal" hidden></div>
  ${chips()}
  <a class="backlink" href="?">← ${u.inici}</a>`;

  const opts = document.getElementById('opts');
  p.opcions.forEach(o=>{
    const b = document.createElement('button');
    b.className = 'opt'; b.type = 'button'; b.textContent = o.t[L];
    b.onclick = ()=>{
      if(o.ok){
        estat[p.num] = true; escriu(KEY, estat);
        mostraReveal(p, seg);
        [...opts.children].forEach(x=>x.disabled = true);
        b.disabled = false; b.style.opacity = 1; b.style.borderColor = 'var(--marker)';
        document.getElementById('retry').classList.remove('show');
        pintaStrata(p.num);
        document.getElementById('reveal').scrollIntoView({behavior:'smooth', block:'center'});
      }else{
        b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
        document.getElementById('retry').classList.add('show');
      }
    };
    opts.appendChild(b);
  });

  if(fet){
    mostraReveal(p, seg);
    [...opts.children].forEach((x,i)=>{
      x.disabled = true;
      if(p.opcions[i].ok){ x.disabled = false; x.style.opacity = 1; x.style.borderColor = 'var(--marker)'; }
    });
  }
  lligaReset(); lligaRegistre(); pintaStrata(p.num);
}

function mostraReveal(p, seg){
  const u = t(), r = document.getElementById('reveal');
  r.hidden = false;
  r.innerHTML = `
    <div class="badge">
      ${CIRCLE}
      <span class="label">${u.moltBe}</span>
      <span class="word">${p.paraula[L]}</span>
    </div>
    <div class="expl">${p.expl[L].map(x=>`<p>${x}</p>`).join('')}</div>
    ${ seg
      ? `<a class="next" href="?p=${seg.num}"><span>${u.etapa} ${seg.num} · ${seg.nom[L]}</span><span>→</span></a>`
      : `<a class="next" href="?p=final"><span>${u.fraseBtn}</span><span>→</span></a>` }`;
}

/* ---------- portada ---------- */
function vistaPortada(){
  const u = t();
  const fetes = PARADES.filter(p=>estat[p.num]).length;
  const seg = PARADES.find(p=>!estat[p.num]) || PARADES[PARADES.length-1];
  app.innerHTML = `
  <div class="cover">
    <img class="cover-img" src="fotos/portada.jpg" alt="${u.portadaAlt}">
    <h1>${u.titol}</h1>
    <p class="lede">${u.lede}</p>
    <ol class="steps">${u.passos.map(s=>`<li>${s}</li>`).join('')}</ol>
    ${blocRegistre()}
    ${equip() ? `<a class="next" href="?p=${fetes ? seg.num : 1}">
        <span>${fetes ? u.continua(seg.num) : u.comenca}</span><span>→</span></a>
        ${retolEquip()}` : ''}
    ${chips()}
  </div>`;
  lligaReset(); lligaRegistre(); pintaStrata(0);
}

/* ---------- final ---------- */
function vistaFinal(){
  const u = t();
  const fetes = PARADES.filter(p=>estat[p.num]).length;
  if(fetes < PARADES.length){
    const seg = PARADES.find(p=>!estat[p.num]);
    app.innerHTML = `
      <div class="eyebrow"><span class="num">?</span><span class="of">${u.encaraNo}</span></div>
      <h1>${u.falten(PARADES.length - fetes)}</h1>
      <p class="intro">${u.faltenText}</p>
      <a class="next" href="?p=${seg.num}"><span>${u.etapa} ${seg.num} · ${seg.nom[L]}</span><span>→</span></a>
      ${chips()}`;
    lligaReset(); pintaStrata(0);
    return;
  }
  const e = equip();
  app.innerHTML = `
    <div class="eyebrow"><span class="num" style="color:#2E3A31">✓</span>
      <span class="of">${u.completada}</span></div>
    <h1>${u.enhoraPre}${u.enhorabona}${(e && e.nom) ? ', ' + esc(e.nom) : ''}!</h1>
    <p class="phrase">${FRASE[L]}</p>
    <p class="intro">${u.fossil}</p>
    <p class="intro">${u.tanca}</p>
    ${chips()}
    <a class="backlink" href="?">← ${u.inici}</a>`;
  lligaReset(); pintaStrata(0);
}

/* ==========================================================================
   PANELLS INTERPRETATIUS
   ========================================================================== */
const LANGS_PANELLS = ['es','en','fr'];
let LP = LANGS_PANELLS.includes(L) ? L : 'es'; // llengua activa per a panells

function pintaIdiomesPanells(contenidor){
  contenidor.innerHTML = LANGS_PANELLS.map(l=>
    `<button type="button" data-l="${l}" aria-current="${l===LP}" lang="${l}">${l}</button>`
  ).join('');
  contenidor.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ LP = b.dataset.l; const q = new URLSearchParams(location.search); const pNum = q.get('p'); rutaPanells(pNum); };
  });
}

function vistaPanells(){
  const u = UI_PANELLS[LP] || UI_PANELLS.es;
  const langsHtml = `<div class="panells-langs" id="panells-langs-list"></div>`;
  const cardes = PANELLS.map(pan=>{
    const nom = pan.nom[LP] || pan.nom.es;
    return `<button class="panell-card" type="button" data-num="${pan.num}">
      <span class="pnum">${pan.num}</span>
      <span class="pinfo">
        <span class="plab">${u.parada} ${pan.num}</span>
        <span class="pnom">${esc(nom)}</span>
      </span>
      <span class="parrow">›</span>
    </button>`;
  }).join('');
  app.innerHTML = `
    <div class="panells-header">
      <h1>${u.titolSeccio}</h1>
      <p>${u.descripcio}</p>
    </div>
    ${langsHtml}
    <div class="panells-grid">${cardes}</div>`;

  pintaIdiomesPanells(document.getElementById('panells-langs-list'));
  app.querySelectorAll('.panell-card').forEach(btn=>{
    btn.onclick = ()=>{
      const num = parseInt(btn.dataset.num, 10);
      const u2 = new URL(location);
      u2.searchParams.set('view','panells');
      u2.searchParams.set('p', num);
      history.pushState({}, '', u2);
      rutaPanells(num);
    };
  });
  pintaStrata(0);
  document.getElementById('panells-btn').classList.add('active');
}

function vistaPanellDetall(num){
  const pan = PANELLS.find(x=>x.num===num);
  if(!pan){ vistaPanells(); return; }
  const u = UI_PANELLS[LP] || UI_PANELLS.es;
  const nom = pan.nom[LP] || pan.nom.es;
  const seccions = (pan[LP] || pan.es || []).map(s=>{
    const parHtml = (s.paras||[]).map(p=>`<p>${p}</p>`).join('');
    return `<div class="panell-seccio">
      ${s.titol ? `<h2 class="panell-titol">${esc(s.titol)}</h2>` : ''}
      ${parHtml}
    </div>`;
  }).join('');
  const foto = `fotos/p${String(num).padStart(2,'0')}.jpg`;

  app.innerHTML = `
    <div class="eyebrow" style="margin-top:28px">
      <span class="num" style="color:var(--rust)">${num}</span>
      <span class="of">${u.parada} ${num}</span>
    </div>
    <h1 style="margin-bottom:12px">${esc(nom)}</h1>
    <div class="panell-detall-langs" id="panells-langs-det"></div>
    <figure><img src="${foto}" alt="${esc(nom)}" loading="lazy"></figure>
    <div id="panell-contingut">${seccions}</div>
    <button class="panell-back" id="panell-back">← ${u.tornar ? u.tornar : 'Enrere'}</button>
    <button class="panell-tornar-joc" id="panell-joc">${u.tornarJoc || 'Tornar al joc'} →</button>`;

  pintaIdiomesPanells(document.getElementById('panells-langs-det'));
  document.getElementById('panell-back').onclick = ()=>{
    const u2 = new URL(location);
    u2.searchParams.delete('p');
    history.pushState({}, '', u2);
    rutaPanells(null);
  };
  document.getElementById('panell-joc').onclick = ()=>{
    const u2 = new URL(location);
    u2.searchParams.delete('view');
    u2.searchParams.delete('p');
    history.pushState({}, '', u2);
    ruta();
  };
  pintaStrata(0);
  document.getElementById('panells-btn').classList.add('active');
}

function rutaPanells(pParam){
  const num = pParam ? parseInt(pParam,10) : null;
  if(num && num>=1 && num<=11) vistaPanellDetall(num);
  else vistaPanells();
}

/* ---------- encaminament ---------- */
function ruta(){
  document.documentElement.lang = L;
  document.title = t().titol;
  brand.textContent = t().titol;
  document.getElementById('panells-btn').classList.remove('active');
  const params = new URLSearchParams(location.search);
  if(params.get('view') === 'panells'){
    LP = LANGS_PANELLS.includes(L) ? L : 'es';
    rutaPanells(params.get('p'));
    return;
  }
  const q = params.get('p');
  if(q === 'final') return vistaFinal();
  const p = PARADES.find(x=>x.num === parseInt(q,10));
  p ? vistaParada(p) : vistaPortada();
}

document.getElementById('panells-btn').onclick = ()=>{
  LP = LANGS_PANELLS.includes(L) ? L : 'es';
  const u = new URL(location);
  u.searchParams.set('view','panells');
  u.searchParams.delete('p');
  history.pushState({}, '', u);
  ruta();
};

window.addEventListener('popstate', ruta);
pintaIdiomes();
ruta();
</script>
</body>
</html>
